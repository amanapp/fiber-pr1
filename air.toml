root = "."
tmp_dir = "tmp"

[build]
  cmd = "swag init -g cmd/main.go && go build -o tmp/app cmd/main.go"
  bin = "tmp/app"
  delay = 1000
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "docs"]
  stop_on_error = true

[log]
  time = true



[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"